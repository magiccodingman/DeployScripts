name: Reusable Debian Tool Integration

on:
  workflow_call:
    inputs:
      test-script:
        description: Repository-relative integration test script to execute.
        required: true
        type: string
      timeout-minutes:
        description: Maximum integration job runtime.
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  integration:
    name: Debian integration
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore Debian 13 cloud image cache
        id: debian-image-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/deployscripts/debian-13-genericcloud-amd64.qcow2
          key: debian-13-genericcloud-amd64-${{ hashFiles('tests/debian/debian-cloud-image-cache-version.txt') }}

      - name: Run integration harness
        env:
          DEPLOYSCRIPTS_CI: "1"
          DEPLOYSCRIPTS_DEBIAN_IMAGE_CACHE: /home/runner/.cache/deployscripts/debian-13-genericcloud-amd64.qcow2
        run: bash "${{ inputs.test-script }}"

      - name: Save Debian 13 cloud image cache
        if: ${{ always() && steps.debian-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/deployscripts/debian-13-genericcloud-amd64.qcow2
          key: debian-13-genericcloud-amd64-${{ hashFiles('tests/debian/debian-cloud-image-cache-version.txt') }}
