name: Reusable Debian Tool Integration

on:
  workflow_call:
    inputs:
      test-script:
        description: Repository-relative integration test script to execute.
        required: true
        type: string
      timeout-minutes:
        description: Maximum integration job runtime.
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  integration:
    name: Debian integration
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run integration harness
        env:
          DEPLOYSCRIPTS_CI: "1"
        run: bash "${{ inputs.test-script }}"
