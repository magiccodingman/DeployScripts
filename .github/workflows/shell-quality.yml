name: Shell Quality

on:
  pull_request:
    paths:
      - '**/*.sh'
      - 'tests/**'
      - '.github/workflows/shell-quality.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.sh'
      - 'tests/**'
      - '.github/workflows/shell-quality.yml'

permissions:
  contents: read

jobs:
  shell-quality:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax and regression checks
        run: bash tests/bash-syntax.sh

      - name: ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -print0 | sort -z)
          shellcheck -x "${scripts[@]}"
