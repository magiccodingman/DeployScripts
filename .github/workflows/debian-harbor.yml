name: Debian Harbor

on:
  pull_request:
    paths:
      - 'debian/harbor/**'
      - 'tests/harbor/**'
      - '.github/workflows/debian-harbor.yml'
  push:
    branches:
      - main
    paths:
      - 'debian/harbor/**'
      - 'tests/harbor/**'
      - '.github/workflows/debian-harbor.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harbor:
    name: Harbor config and official prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify runner dependencies
        run: |
          python3 -c 'import yaml'
          openssl version
          docker compose version

      - name: Compile Python helpers
        run: |
          python3 -m py_compile debian/harbor/lib/render_config.py
          python3 -m py_compile debian/harbor/lib/s3_probe.py
          python3 -m py_compile tests/harbor/s3-probe-http-shape.py

      - name: Config renderer regression
        run: bash tests/harbor/config-render.sh

      - name: S3 probe request-shape regression
        run: |
          python3 -m venv /tmp/deployscripts-harbor-boto
          /tmp/deployscripts-harbor-boto/bin/pip install --disable-pip-version-check --quiet 'boto3==1.37.9'
          /tmp/deployscripts-harbor-boto/bin/python tests/harbor/s3-probe-http-shape.py

      - name: Official Harbor prepare integration
        env:
          HARBOR_TEST_VERSION: '2.15.2'
        run: bash tests/harbor/prepare-integration.sh
